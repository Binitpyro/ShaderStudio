[package]
name = "shaderstudio-desktop"
version = "0.1.0"
description = "ShaderStudio Visual Shader IDE"
authors = ["ShaderStudio Contributors"]
edition = "2021"

[lib]
name = "shaderstudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
