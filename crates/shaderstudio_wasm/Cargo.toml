[package]
name = "shaderstudio_wasm"
version = "0.1.0"
edition = "2021"
description = "All-in-One Rust WebAssembly acceleration engine for ShaderStudio"
repository = "https://github.com/Binitpyro/ShaderStudio"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
naga = { version = "24", features = ["wgsl-in", "glsl-in", "hlsl-out", "glsl-out"] }
png = "0.17"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
